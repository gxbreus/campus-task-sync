name: Sincronizar Campus com Notion

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOOGLE_DRIVE_CONFIGURED: ${{ secrets.GOOGLE_CLIENT_ID != '' && secrets.GOOGLE_CLIENT_SECRET != '' && secrets.GOOGLE_REFRESH_TOKEN != '' }}
      LOCAL_SYNC_CONFIGURED: ${{ secrets.CALENDAR_ICS_URL != '' && secrets.NOTION_TOKEN != '' && secrets.NOTION_DATA_SOURCE_ID != '' }}
      WEB_SYNC_CONFIGURED: ${{ secrets.WEB_SYNC_CRON_SECRET != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
        if: ${{ env.LOCAL_SYNC_CONFIGURED == 'true' }}
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_ASSIGNEE_USER_ID: ${{ secrets.NOTION_ASSIGNEE_USER_ID }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ENABLE_AI_SUGGESTIONS: ${{ vars.ENABLE_AI_SUGGESTIONS }}
      - name: Sincronizar materiais com Google Drive
        if: ${{ env.GOOGLE_DRIVE_CONFIGURED == 'true' }}
        run: npm run sync:drive
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      - name: Sincronizar instalações do beta web
        if: ${{ env.WEB_SYNC_CONFIGURED == 'true' }}
        run: >-
          curl --fail-with-body --retry 2 --request POST
          --header "Authorization: Bearer $WEB_SYNC_CRON_SECRET"
          https://campus-task-sync.vercel.app/api/cron/sync
        env:
          WEB_SYNC_CRON_SECRET: ${{ secrets.WEB_SYNC_CRON_SECRET }}
